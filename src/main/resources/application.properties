spring.application.name=duobaan

# ---------- MySQL 数据库 ----------
# 凭据通过环境变量注入（DB_URL / DB_USERNAME / DB_PASSWORD），避免明文口令入库
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/duobaan?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA ----------
# ddl-auto=none：禁止 Hibernate 干预表结构，全部交给 schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- 建表脚本 ----------
# 每次启动都执行 classpath:schema.sql（脚本内部用 IF NOT EXISTS 保证幂等）
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ---------- 多巴胺平台配置 ----------
# 天气服务（qweather 和风天气；留空则返回占位数据）
duobaan.weather.provider=qweather
duobaan.weather.api-key=
duobaan.weather.location=101010100
duobaan.weather.cache-ttl-seconds=600

# 大模型（OpenAI 兼容协议；留空则返回降级提示）
duobaan.llm.base-url=https://api.openai.com/v1
duobaan.llm.api-key=
duobaan.llm.model=gpt-4o-mini
# 全局外部 HTTP 读超时（LLM/天气/向量化共用；媒体 ASR 走独立 mediaRestClient，读超时 180s）
duobaan.llm.timeout-seconds=30

# ---------- Redis（知识库向量存储） ----------
# 本地 Redis；向量以 JSON 数组形式存在 Redis，检索在内存中做余弦相似度
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=3000ms
# 关闭 JMX：JedisPool 会被 Spring 自动注册为 MBean，devtools 热重启时易冲突，本项目不需要 JMX
spring.jmx.enabled=false
# 本项目只通过 JedisPool 直连 Redis，不使用 Spring Data Redis 的模板与仓储。
# 不排除的话 Boot 会自动配置 JedisConnectionFactory + RedisTemplate/StringRedisTemplate（= 并起第二套连接池），
# 并在启动时刷出多条 "Could not safely identify store assignment" 噪声日志。
spring.autoconfigure.exclude=\
  org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,\
  org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

# ---------- 上传体积上限 ----------
# 不配置则使用 Boot 默认值 max-file-size=1MB：>1MB 的音频/文件会抛 MaxUploadSizeExceededException
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=40MB
server.tomcat.max-swallow-size=40MB

# ---------- 监听地址 ----------
# 本地部署平台：只监听本机，不对外提供访问。
# 本项目不引入登录认证，因此「限定监听范围」是唯一且必需的安全边界，请勿改成 0.0.0.0。
server.address=127.0.0.1

# ---------- 本地私有配置 ----------
# application-local.properties（已在 .gitignore 排除）用于放真实数据库口令等本地私有值；
# 该文件不存在时不影响启动（口令退化为环境变量 DB_PASSWORD 或空值）。
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.application.name=duobaan

# ---------- MySQL 数据库 ----------
spring.datasource.url=jdbc:mysql://localhost:3306/duobaan?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

# ---------- JPA ----------
# ddl-auto=none：禁止 Hibernate 干预表结构，全部交给 schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- 建表脚本 ----------
# 每次启动都执行 classpath:schema.sql（脚本内部用 IF NOT EXISTS 保证幂等）
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ---------- 多巴胺平台配置 ----------
# 天气服务（qweather 和风天气；留空则返回占位数据）
duobaan.weather.provider=qweather
duobaan.weather.api-key=
duobaan.weather.location=101010100
duobaan.weather.cache-ttl-seconds=600

# 大模型（OpenAI 兼容协议；留空则返回降级提示）
duobaan.llm.base-url=https://api.openai.com/v1
duobaan.llm.api-key=
duobaan.llm.model=gpt-4o-mini
duobaan.llm.timeout-seconds=30

# ---------- Redis（知识库向量存储） ----------
# 本地 Redis；向量以 JSON 数组形式存在 Redis，检索在内存中做余弦相似度
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=3000ms
# 关闭 JMX：JedisPool 会被 Spring 自动注册为 MBean，devtools 热重启时易冲突，本项目不需要 JMX
spring.jmx.enabled=false
